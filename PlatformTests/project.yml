name: LibraryPlatformTests
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  btc-swift:
    path: ${LIBRARY_PACKAGE_PATH}
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "2858MX5336"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  LibraryTestHost:
    type: application
    platform: iOS
    sources:
      - path: ${LIBRARY_PACKAGE_PATH}/PlatformTests/Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.winnowwallet.LibraryTestHost
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  LibraryKeychainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ${LIBRARY_PACKAGE_PATH}/PlatformTests/KeychainAttributeTests.swift
    dependencies:
      - target: LibraryTestHost
      - package: btc-swift
        product: WalletCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.winnowwallet.LibraryKeychainTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LibraryTestHost.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LibraryTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  LibraryKeychainTests:
    build:
      targets:
        LibraryTestHost: all
    test:
      targets:
        - LibraryKeychainTests
